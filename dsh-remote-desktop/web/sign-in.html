<small>DeepSeek · 远程桌面</small>
<h1>此浏览器需要先获得访问授权</h1>
<p>普通网址只用于打开入口。首次访问或登录状态失效时，请从 Mac 获取本人设备的登录链接。</p>
<ol>
<li>在 Mac 已登录的远程桌面页，展开「在手机或 iPad 上打开」。</li>
<li>点击「准备手机访问链接」，扫描二维码，或复制完整链接到手机。</li>
<li>在手机同一个浏览器中打开授权链接，连接后可收藏普通网址。</li>
</ol>
<p>微信内浏览器、Safari 和 Chrome 的登录状态可能不共享。更换浏览器时请重新授权；旧链接无法使用时，请在 Mac 重新生成。无需在这里输入 Mac 密码。</p>
<a href="./">已完成授权，重新打开</a>
