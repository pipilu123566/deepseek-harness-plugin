        <text x="625" y="238" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Two fingers</text>
        <text x="625" y="255" class="t-muted" font-size="8" text-anchor="middle">Scroll / zoom</text>

        <!-- Edge labels -->





        <text x="40" y="23" class="t-primary" font-size="18" font-weight="500">DSH Remote Desktop 0.4.2</text><text x="40" y="41" class="t-muted" font-size="10">Top-bar settings, direct typing, keyboard/mouse and touch</text><text x="40" y="321" class="t-primary" font-size="11">Wheel: scroll     Shift + wheel: horizontal     Ctrl / Cmd + wheel: zoom</text><text x="40" y="374" class="t-muted" font-size="10">Workflow illustration, not a recording. No real desktop, login link or password.</text></svg>