        <rect x="42" y="217" width="92" height="52" rx="6" class="c-mask"/>
        <rect x="42" y="217" width="92" height="52" rx="6" class="c-backend" stroke-width="1.5"/>
        <text x="88" y="238" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Top bar</text>
        <text x="88" y="255" class="t-muted" font-size="8" text-anchor="middle">Screen / mode</text>

        <rect x="384" y="217" width="92" height="52" rx="6" class="c-mask"/>
        <rect x="384" y="217" width="92" height="52" rx="6" class="c-backend" stroke-width="1.5"/>
        <text x="430" y="238" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Click target</text>
        <text x="430" y="255" class="t-muted" font-size="8" text-anchor="middle">Tap / locate</text>

        <rect x="579" y="217" width="92" height="52" rx="6" class="c-mask"/>
