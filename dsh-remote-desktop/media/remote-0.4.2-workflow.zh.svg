        <text x="40" y="23" class="t-primary" font-size="18" font-weight="500">DSH 远程桌面 0.4.2</text><text x="40" y="41" class="t-muted" font-size="10">顶部设置 · 直接输入 · 电脑键鼠与触屏操作</text><text x="40" y="321" class="t-primary" font-size="11">滚轮滚动 · Shift + 滚轮横向 · Ctrl / ⌘ + 滚轮缩放</text><text x="40" y="374" class="t-muted" font-size="10">流程示意，非界面实录；不展示真实桌面、登录链接或密码。</text></svg>