<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="808" viewBox="0 0 720 404" role="img" aria-label="DSH Remote Desktop 0.4.2 — 操作流程示意 · 非界面实录 (workflow diagram)">
        <style>svg{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.c-grid{fill:none;stroke:#263346}.c-lane{fill:#131e2e;stroke:#34445d}.c-mask{fill:#101a28}.c-frontend{fill:#10333e;stroke:#22d3ee}.c-backend{fill:#103d31;stroke:#34d399}.t-primary{fill:#eef4fc}.t-muted{fill:#b2bfd1}.t-dim{fill:#95a8bf}.a-default{fill:none;stroke:#7890ab}.m-default{fill:#7890ab}</style><!-- Definitions -->
        <defs>
